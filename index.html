    <script>
      // Hide the home page until the preloader covers it (desktop + motion, first visit per tab only).
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        // Keep the hero hidden until its content is rendered, so the raw placeholder text never flashes.
        d.classList.add('home-pending');
        setTimeout(function () { d.classList.remove('home-pending'); }, 3000);
        var seen = false;
        try { seen = sessionStorage.getItem('preloader-seen') === '1'; } catch (e) {}
        if (!seen && matchMedia('(min-width: 769px)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('motion-pending');
          setTimeout(function () { d.classList.remove('motion-pending'); }, 4000);
        }
      })();
    </script>
