<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="Segoe UI, system-ui, -apple-system, sans-serif" fill="#1a140f">
  <title>Mock phone screen with made-up data: a weighbridge entry showing truck weights and a royalty amount worked out by the server</title>
  <rect width="600" height="800" fill="#ffecda"/>
  <rect x="140" y="80" width="320" height="640" rx="34" fill="#1a140f"/>
  <rect x="152" y="92" width="296" height="616" rx="24" fill="#fffbf0"/>
  <rect x="262" y="104" width="76" height="8" rx="4" fill="#1a140f" opacity=".85"/>

  <text x="176" y="150" font-size="12" letter-spacing="1.5" opacity=".6">WEIGHBRIDGE · NEW ENTRY</text>
  <text x="176" y="180" font-size="22">Truck 0012</text>
  <text x="176" y="204" font-size="13" opacity=".6">Sample vehicle · heavy truck</text>

  <!-- truck -->
  <g transform="translate(196 226)" fill="none" stroke="#1a140f" stroke-width="2">
    <rect x="0" y="10" width="140" height="56" fill="#f2c49b"/>
    <path d="M140 26H180L204 46V66H140Z" fill="#fffbf0"/>
    <circle cx="34" cy="74" r="12" fill="#fffbf0"/><circle cx="104" cy="74" r="12" fill="#fffbf0"/><circle cx="178" cy="74" r="12" fill="#fffbf0"/>
    <line x1="-10" y1="90" x2="220" y2="90"/>
  </g>

  <g font-size="15">
    <line x1="176" y1="340" x2="426" y2="340" stroke="#1a140f" stroke-opacity=".15"/>
    <text x="176" y="370" opacity=".7">Gross weight</text><text x="426" y="370" text-anchor="end">38.40 t</text>
    <text x="176" y="402" opacity=".7">Empty weight</text><text x="426" y="402" text-anchor="end">12.15 t</text>
    <text x="176" y="434" opacity=".7">Net material</text><text x="426" y="434" text-anchor="end">26.25 t</text>
    <line x1="176" y1="452" x2="426" y2="452" stroke="#1a140f" stroke-opacity=".15"/>
    <text x="176" y="484" opacity=".7">Rate rule</text><text x="426" y="484" text-anchor="end">Round 2</text>
    <text x="176" y="516" opacity=".7">Paid cash · online</text><text x="426" y="516" text-anchor="end">₹ 4,000 · ₹ 2,500</text>
  </g>
  <rect x="176" y="540" width="250" height="70" fill="#f2c49b"/>
  <text x="192" y="566" font-size="11" letter-spacing="1.5" opacity=".75">ROYALTY (SERVER CHECKED)</text>
  <text x="192" y="596" font-size="24">₹ 7,481.25</text>
  <rect x="176" y="628" width="250" height="48" fill="#1a140f"/>
  <text x="301" y="657" font-size="13" fill="#fffbf0" text-anchor="middle" letter-spacing="1.5">SAVE ENTRY</text>
</svg>
