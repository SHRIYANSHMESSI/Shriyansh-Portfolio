<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, system-ui, -apple-system, sans-serif" fill="#1a140f">
  <title>Three mock phone screens with made-up data: an owner dashboard, a partner ledger and a statement exported as PDF</title>
  <rect width="1600" height="1000" fill="#ffecda"/>

  <!-- phone 1: dashboard -->
  <g transform="translate(220 170)">
    <rect width="320" height="660" rx="34" fill="#1a140f"/>
    <rect x="12" y="12" width="296" height="636" rx="24" fill="#fffbf0"/>
    <text x="36" y="72" font-size="12" letter-spacing="1.5" opacity=".6">DASHBOARD · TODAY</text>
    <g transform="translate(36 90)" font-size="13">
      <rect width="120" height="34" fill="#1a140f"/><text x="60" y="22" fill="#fffbf0" text-anchor="middle">Mine</text>
      <rect x="128" width="120" height="34" fill="none" stroke="#1a140f"/><text x="188" y="22" text-anchor="middle">Checkpost</text>
    </g>
    <g font-size="11" letter-spacing="1">
      <rect x="36" y="144" width="118" height="92" fill="#f2c49b"/><text x="50" y="170" opacity=".75">TRIPS</text><text x="50" y="214" font-size="26" letter-spacing="0">42</text>
      <rect x="166" y="144" width="118" height="92" fill="none" stroke="#1a140f"/><text x="180" y="170" opacity=".6">COLLECTED</text><text x="180" y="214" font-size="20" letter-spacing="0">₹ 2.1 L</text>
      <rect x="36" y="248" width="118" height="92" fill="none" stroke="#1a140f"/><text x="50" y="274" opacity=".6">PENDING</text><text x="50" y="318" font-size="20" letter-spacing="0">₹ 18 K</text>
      <rect x="166" y="248" width="118" height="92" fill="none" stroke="#1a140f"/><text x="180" y="274" opacity=".6">STOCK LEFT</text><text x="180" y="318" font-size="20" letter-spacing="0">640 t</text>
    </g>
    <text x="36" y="380" font-size="12" letter-spacing="1.5" opacity=".6">LATEST ENTRIES</text>
    <g font-size="14">
      <line x1="36" y1="396" x2="284" y2="396" stroke="#1a140f" stroke-opacity=".15"/>
      <text x="36" y="426">Truck 0012 · 26.2 t</text><text x="284" y="426" text-anchor="end">paid</text>
      <line x1="36" y1="444" x2="284" y2="444" stroke="#1a140f" stroke-opacity=".15"/>
      <text x="36" y="474">Truck 0047 · 19.8 t</text><text x="284" y="474" text-anchor="end">pending</text>
      <line x1="36" y1="492" x2="284" y2="492" stroke="#1a140f" stroke-opacity=".15"/>
      <text x="36" y="522">Truck 0031 · 24.0 t</text><text x="284" y="522" text-anchor="end">settled</text>
    </g>
  </g>

  <!-- phone 2: partners -->
  <g transform="translate(640 120)">
    <rect width="320" height="660" rx="34" fill="#1a140f"/>
    <rect x="12" y="12" width="296" height="636" rx="24" fill="#fffbf0"/>
    <text x="36" y="72" font-size="12" letter-spacing="1.5" opacity=".6">PARTNERS</text>
    <text x="36" y="102" font-size="22">Who gets what</text>
    <g font-size="14">
      <g transform="translate(36 130)"><rect width="248" height="76" fill="none" stroke="#1a140f"/><text x="16" y="30">Partner A</text><text x="232" y="30" text-anchor="end">40%</text><rect x="16" y="46" width="216" height="8" fill="#1a140f" opacity=".1"/><rect x="16" y="46" width="86" height="8" fill="#1a140f"/></g>
      <g transform="translate(36 218)"><rect width="248" height="76" fill="none" stroke="#1a140f"/><text x="16" y="30">Partner B</text><text x="232" y="30" text-anchor="end">34.50%</text><rect x="16" y="46" width="216" height="8" fill="#1a140f" opacity=".1"/><rect x="16" y="46" width="76" height="8" fill="#1a140f"/></g>
      <g transform="translate(36 306)"><rect width="248" height="76" fill="none" stroke="#1a140f"/><text x="16" y="30">Partner C</text><text x="232" y="30" text-anchor="end">25.50%</text><rect x="16" y="46" width="216" height="8" fill="#1a140f" opacity=".1"/><rect x="16" y="46" width="55" height="8" fill="#1a140f"/></g>
    </g>
    <rect x="36" y="410" width="248" height="120" fill="#f2c49b"/>
    <text x="54" y="444" font-size="13">The share arrives as the text</text>
    <text x="54" y="468" font-size="13">"25.50", not a number. One bad</text>
    <text x="54" y="492" font-size="13">cast used to empty this whole</text>
    <text x="54" y="516" font-size="13">list. Now it parses safely.</text>
    <rect x="36" y="556" width="248" height="48" fill="#1a140f"/>
    <text x="160" y="585" font-size="13" fill="#fffbf0" text-anchor="middle" letter-spacing="1.5">PAY PARTNER</text>
  </g>

  <!-- phone 3: statement pdf -->
  <g transform="translate(1060 170)">
    <rect width="320" height="660" rx="34" fill="#1a140f"/>
    <rect x="12" y="12" width="296" height="636" rx="24" fill="#fffbf0"/>
    <text x="36" y="72" font-size="12" letter-spacing="1.5" opacity=".6">STATEMENT · PDF</text>
    <rect x="36" y="92" width="248" height="450" fill="#fffbf0" stroke="#1a140f"/>
    <text x="56" y="128" font-size="16">Party statement (sample)</text>
    <text x="56" y="150" font-size="12" opacity=".6">1 to 31 of a month</text>
    <g font-size="13">
      <rect x="56" y="170" width="208" height="76" fill="none" stroke="#1a140f" stroke-opacity=".4"/>
      <text x="70" y="196">Entry 0012</text><text x="250" y="196" text-anchor="end">₹ 7,481</text>
      <text x="70" y="222" opacity=".6">cash 4,000 · online 2,500</text>
      <rect x="56" y="258" width="208" height="76" fill="none" stroke="#1a140f" stroke-opacity=".4"/>
      <text x="70" y="284">Entry 0047</text><text x="250" y="284" text-anchor="end">₹ 5,640</text>
      <text x="70" y="310" opacity=".6">+ ₹ 140 discount · settled</text>
      <rect x="56" y="346" width="208" height="76" fill="none" stroke="#1a140f" stroke-opacity=".4"/>
      <text x="70" y="372">Entry 0031</text><text x="250" y="372" text-anchor="end">₹ 6,850</text>
      <text x="70" y="398" opacity=".6">pending ₹ 850</text>
      <line x1="56" y1="446" x2="264" y2="446" stroke="#1a140f" stroke-opacity=".3"/>
      <text x="56" y="478">Remaining</text><text x="264" y="478" text-anchor="end">₹ 850</text>
    </g>
    <rect x="36" y="566" width="248" height="48" fill="#1a140f"/>
    <text x="160" y="595" font-size="13" fill="#fffbf0" text-anchor="middle" letter-spacing="1.5">PRINT OR SAVE PDF</text>
  </g>
</svg>
