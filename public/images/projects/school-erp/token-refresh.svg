<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Segoe UI, system-ui, -apple-system, sans-serif" fill="#1a140f">
  <title>Diagram: many requests failing at once all go through one refresh gate, the server rotates the token once, and only a real refusal logs the user out</title>
  <rect width="1600" height="720" fill="#fffbf0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a140f"/></marker>
  </defs>
  <text x="80" y="90" font-size="22" letter-spacing="3">ONE GATE FOR EVERY TOKEN REFRESH</text>
  <line x1="80" y1="110" x2="1520" y2="110" stroke="#1a140f" stroke-opacity=".15"/>

  <g font-size="18">
    <g transform="translate(80 160)">
      <rect width="250" height="56" fill="#fffbf0" stroke="#1a140f"/><text x="20" y="35">dashboard → 401</text>
      <rect y="76" width="250" height="56" fill="#fffbf0" stroke="#1a140f"/><text x="20" y="111">homework → 401</text>
      <rect y="152" width="250" height="56" fill="#fffbf0" stroke="#1a140f"/><text x="20" y="187">notices → 401</text>
      <rect y="228" width="250" height="56" fill="#fffbf0" stroke="#1a140f"/><text x="20" y="263">fees → 401</text>
      <rect y="304" width="250" height="56" fill="#fffbf0" stroke="#1a140f"/><text x="20" y="339">app start</text>
    </g>

    <g transform="translate(520 220)">
      <rect width="400" height="240" fill="#b9c8f0" stroke="#1a140f" stroke-width="1.5"/>
      <text x="30" y="56" font-size="15" letter-spacing="2" opacity=".75">REFRESH COORDINATOR</text>
      <text x="30" y="100">Rotate only if the stored token</text>
      <text x="30" y="128">is the one this request used.</text>
      <text x="30" y="170">Check again after every await,</text>
      <text x="30" y="198">so a stale read can't win.</text>
    </g>

    <g transform="translate(1100 160)">
      <rect width="420" height="80" fill="#fffbf0" stroke="#1a140f"/>
      <text x="24" y="34">refreshed</text><text x="24" y="62" font-size="16" opacity=".65">retry with the newest token</text>
      <rect y="120" width="420" height="80" fill="#1a140f"/>
      <text x="24" y="154" fill="#fffbf0">rejected by server</text><text x="24" y="182" font-size="16" fill="#fffbf0" opacity=".75">the only case that logs out</text>
      <rect y="240" width="420" height="80" fill="#fffbf0" stroke="#1a140f" stroke-dasharray="6 5"/>
      <text x="24" y="274">timeout, 5xx, 429</text><text x="24" y="302" font-size="16" opacity=".65">keep the session, try later</text>
    </g>
  </g>

  <g stroke="#1a140f" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M332 188H420V300H516"/>
    <path d="M332 340H516"/>
    <path d="M332 416H420V380H516"/>
    <path d="M922 300H1010V200H1096"/>
    <path d="M922 340H1096"/>
    <path d="M922 380H1010V440H1096"/>
  </g>
  <g stroke="#1a140f" stroke-width="1.5" fill="none">
    <path d="M332 264H420"/>
    <path d="M332 492H420V416"/>
  </g>
  <text x="80" y="620" font-size="19" opacity=".7">Before: parallel failures each refreshed on their own, reused a dead token, and the user got logged out "randomly".</text>
  <text x="80" y="652" font-size="19" opacity=".7">After: 14 unit tests cover the races, and a mutation test proves they catch the old bug.</text>
</svg>
