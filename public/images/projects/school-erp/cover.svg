<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="Segoe UI, system-ui, -apple-system, sans-serif" fill="#1a140f">
  <title>Mock phone screen with made-up data: marking class attendance while offline</title>
  <rect width="600" height="800" fill="#f0f4ff"/>
  <rect x="140" y="80" width="320" height="640" rx="34" fill="#1a140f"/>
  <rect x="152" y="92" width="296" height="616" rx="24" fill="#fffbf0"/>
  <rect x="262" y="104" width="76" height="8" rx="4" fill="#1a140f" opacity=".85"/>

  <text x="176" y="150" font-size="12" letter-spacing="1.5" opacity=".6">ATTENDANCE</text>
