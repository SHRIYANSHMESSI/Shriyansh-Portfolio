<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, system-ui, -apple-system, sans-serif" fill="#1a140f">
  <title>Three mock phone screens with made-up data: a parent home with a child switcher, push notifications, and a fee receipt made on the phone</title>
  <rect width="1600" height="1000" fill="#f0f4ff"/>

  <!-- phone 1: parent home -->
  <g transform="translate(220 170)">
    <rect width="320" height="660" rx="34" fill="#1a140f"/>
    <rect x="12" y="12" width="296" height="636" rx="24" fill="#fffbf0"/>
    <text x="36" y="72" font-size="12" letter-spacing="1.5" opacity=".6">GOOD MORNING</text>
    <text x="36" y="102" font-size="22">Parent home</text>
    <g transform="translate(36 124)">
      <rect width="248" height="44" fill="#b9c8f0"/>
      <circle cx="24" cy="22" r="12" fill="#fffbf0"/><text x="46" y="27" font-size="15">Child A · Class 4</text>
      <text x="228" y="27" font-size="15" text-anchor="end">⇄</text>
    </g>
    <g font-size="14">
      <rect x="36" y="188" width="118" height="92" fill="none" stroke="#1a140f"/><text x="50" y="216" font-size="11" letter-spacing="1" opacity=".6">ATTENDANCE</text><text x="50" y="256" font-size="26">96%</text>
      <rect x="166" y="188" width="118" height="92" fill="none" stroke="#1a140f"/><text x="180" y="216" font-size="11" letter-spacing="1" opacity=".6">FEES DUE</text><text x="180" y="256" font-size="26">₹ 0</text>
      <rect x="36" y="292" width="118" height="92" fill="none" stroke="#1a140f"/><text x="50" y="320" font-size="11" letter-spacing="1" opacity=".6">HOMEWORK</text><text x="50" y="360" font-size="26">2</text>
      <rect x="166" y="292" width="118" height="92" fill="none" stroke="#1a140f"/><text x="180" y="320" font-size="11" letter-spacing="1" opacity=".6">NEXT TEST</text><text x="180" y="360" font-size="22">Mon</text>
    </g>
    <text x="36" y="424" font-size="12" letter-spacing="1.5" opacity=".6">TODAY</text>
    <g font-size="14">
      <line x1="36" y1="440" x2="284" y2="440" stroke="#1a140f" stroke-opacity=".15"/>
      <text x="36" y="470">Maths homework posted</text>
      <line x1="36" y1="488" x2="284" y2="488" stroke="#1a140f" stroke-opacity=".15"/>
      <text x="36" y="518">PTM on Saturday, 10 am</text>
      <line x1="36" y1="536" x2="284" y2="536" stroke="#1a140f" stroke-opacity=".15"/>
      <text x="36" y="566">Bus leaves 5 min late</text>
    </g>
  </g>

  <!-- phone 2: notifications -->
  <g transform="translate(640 120)">
    <rect width="320" height="660" rx="34" fill="#1a140f"/>
    <rect x="12" y="12" width="296" height="636" rx="24" fill="#e9edf8"/>
    <text x="160" y="110" font-size="44" text-anchor="middle" font-weight="300">9:41</text>
    <text x="160" y="140" font-size="13" text-anchor="middle" opacity=".6">Lock screen</text>
    <g font-size="13">
      <rect x="32" y="180" width="256" height="84" rx="14" fill="#fffbf0"/>
      <text x="50" y="206" font-size="11" letter-spacing="1" opacity=".6">SCHOOL APP · NOW</text>
      <text x="50" y="230" font-size="14">Fee receipt ready (Child A)</text>
      <text x="50" y="250" opacity=".7">Tap to open the receipt</text>
      <rect x="32" y="276" width="256" height="84" rx="14" fill="#fffbf0"/>
      <text x="50" y="302" font-size="11" letter-spacing="1" opacity=".6">SCHOOL APP · 2 MIN</text>
      <text x="50" y="326" font-size="14">Leave approved (Child B)</text>
      <text x="50" y="346" opacity=".7">Opens on Child B's profile</text>
      <rect x="32" y="372" width="256" height="84" rx="14" fill="#fffbf0"/>
      <text x="50" y="398" font-size="11" letter-spacing="1" opacity=".6">SCHOOL APP · 1 H</text>
      <text x="50" y="422" font-size="14">New class test on Monday</text>
      <text x="50" y="442" opacity=".7">Chapters 4 to 6</text>
    </g>
    <rect x="32" y="500" width="256" height="100" fill="#b9c8f0"/>
    <text x="50" y="532" font-size="13">One phone, two children:</text>
    <text x="50" y="556" font-size="13">each push switches to the</text>
    <text x="50" y="580" font-size="13">right child before opening.</text>
  </g>

  <!-- phone 3: receipt -->
  <g transform="translate(1060 170)">
    <rect width="320" height="660" rx="34" fill="#1a140f"/>
    <rect x="12" y="12" width="296" height="636" rx="24" fill="#fffbf0"/>
    <text x="36" y="72" font-size="12" letter-spacing="1.5" opacity=".6">FEE RECEIPT · PDF</text>
    <rect x="36" y="92" width="248" height="430" fill="#fffbf0" stroke="#1a140f"/>
    <text x="56" y="130" font-size="16">Receipt #0001 (sample)</text>
    <text x="56" y="154" font-size="12" opacity=".6">Made on the phone, works offline</text>
    <line x1="56" y1="172" x2="264" y2="172" stroke="#1a140f" stroke-opacity=".2"/>
    <g font-size="14">
      <text x="56" y="204">Tuition fee</text><text x="264" y="204" text-anchor="end">₹ 4,500</text>
      <text x="56" y="236">Transport</text><text x="264" y="236" text-anchor="end">₹ 1,200</text>
      <text x="56" y="268">Activity</text><text x="264" y="268" text-anchor="end">₹ 300</text>
      <line x1="56" y1="290" x2="264" y2="290" stroke="#1a140f" stroke-opacity=".2"/>
      <text x="56" y="322">Total paid</text><text x="264" y="322" text-anchor="end">₹ 6,000</text>
    </g>
    <rect x="56" y="350" width="96" height="96" fill="none" stroke="#1a140f"/>
    <g fill="#1a140f"><rect x="66" y="360" width="24" height="24"/><rect x="118" y="360" width="24" height="24"/><rect x="66" y="412" width="24" height="24"/><rect x="100" y="394" width="10" height="10"/><rect x="118" y="420" width="16" height="16"/></g>
    <text x="168" y="390" font-size="12" opacity=".6">English</text>
    <text x="168" y="410" font-size="12" opacity=".6">and Hindi</text>
    <rect x="36" y="546" width="248" height="48" fill="#1a140f"/>
    <text x="160" y="575" font-size="13" fill="#fffbf0" text-anchor="middle" letter-spacing="1.5">SHARE RECEIPT</text>
  </g>
</svg>
